<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer namorar comigo?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6e6;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            text-align: center;
        }
        .container {
            text-align: center;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            height: 50px;
            width: 300px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }
        #btn-sim {
            background-color: #ff4d6d;
            color: white;
        }
        #btn-sim:hover {
            transform: scale(1.1);
        }
        #btn-nao {
            background-color: #ccc;
            color: #333;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quer namorar comigo? ❤️</h1>
        <div class="buttons">
            <button id="btn-sim" onclick="aceitou()">SIM</button>
            <button id="btn-nao" onmouseover="fuger(this)" onclick="fuger(this)">NÃO</button>
        </div>
    </div>

    <script>
        function fuger(botao) {
            // Gera posições aleatórias na tela para o botão "Não" fugir
            const larguraJanela = window.innerWidth - botao.offsetWidth;
            const alturaJanela = window.innerHeight - botao.offsetHeight;
            
            const novoX = Math.random() * (larguraJanela - 100) + 50;
            const novoY = Math.random() * (alturaJanela - 100) + 50;
            
            botao.style.position = 'fixed';
            botao.style.left = novoX + 'px';
            botao.style.top = novoY + 'px';
        }

        function aceitou() {
            alert("Sabia que diria sim! Te amo! 🥰❤️");
            // Se quiser redirecionar para o seu WhatsApp, mude o link abaixo:
            // window.location.href = "https://wa.me";
        }
    </script>

</body>
</html>
